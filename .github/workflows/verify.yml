name: Verify

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - version1.1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:domain
      - run: npm run test:integration
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      - run: git diff --check
